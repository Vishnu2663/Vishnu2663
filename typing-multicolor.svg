<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100">
  <defs>
    <!-- Animated gradient for the card border -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="25%" stop-color="#BF00FF"/>
      <stop offset="50%" stop-color="#1E90FF"/>
      <stop offset="75%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#FFA500"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Neon glow -->
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .t {
      font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 34px;
      font-weight: 700;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      animation: type 12s infinite;
    }
    /* 6 lines x 2s = 12s cycle, so lines never overlap */
    .l1 { animation-delay: 0s; }
    .l2 { animation-delay: 2s; }
    .l3 { animation-delay: 4s; }
    .l4 { animation-delay: 6s; }
    .l5 { animation-delay: 8s; }
    .l6 { animation-delay: 10s; }

    @keyframes type {
      0%     { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateY(6px); }
      1%     { opacity: 1; clip-path: inset(0 100% 0 0); transform: translateY(0);
               animation-timing-function: steps(22, end); }
      9%     { opacity: 1; clip-path: inset(0 0 0 0); }
      14.5%  { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); }
      16.6%  { opacity: 0; clip-path: inset(0 0 0 0); transform: translateY(-6px); }
      100%   { opacity: 0; clip-path: inset(0 100% 0 0); }
    }

    .caret { animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .prompt {
      font-family: "Fira Code", Consolas, monospace;
      font-size: 34px; font-weight: 700; fill: #8b949e;
    }
    .dot { opacity: .9; }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan {
      0%   { transform: translateX(-200px); }
      100% { transform: translateX(1100px); }
    }
  ]]></style>

  <!-- Terminal card -->
  <rect x="3" y="3" width="994" height="94" rx="14" fill="url(#bg)"
        stroke="url(#border)" stroke-width="2.5"/>
  <circle class="dot" cx="24" cy="19" r="5" fill="#FF5F56"/>
  <circle class="dot" cx="41" cy="19" r="5" fill="#FFBD2E"/>
  <circle class="dot" cx="58" cy="19" r="5" fill="#27C93F"/>

  <!-- Light sweep across the card -->
  <rect class="scan" x="0" y="6" width="120" height="88" fill="#ffffff" opacity="0.04"/>

  <text x="26" y="72" class="prompt">❯</text>

  <g filter="url(#glow)">
    <text x="62" y="72" class="t l1" fill="#FF1493">⚙️ Spring Boot &amp; Web Technologies<tspan class="caret">▌</tspan></text>
    <text x="62" y="72" class="t l2" fill="#BF00FF">🍃 Node.js &amp; PostgreSQL<tspan class="caret">▌</tspan></text>
    <text x="62" y="72" class="t l3" fill="#1E90FF">🧑‍💻 Java Full Stack Developer<tspan class="caret">▌</tspan></text>
    <text x="62" y="72" class="t l4" fill="#FFA500">☁️ DevOps &amp; Cloud Enthusiast<tspan class="caret">▌</tspan></text>
    <text x="62" y="72" class="t l5" fill="#32CD32">🛠️ MySQL, AWS &amp; DevOps Tools<tspan class="caret">▌</tspan></text>
    <text x="62" y="72" class="t l6" fill="#FF4040">💡 Continuous Learner<tspan class="caret">▌</tspan></text>
  </g>
</svg>
