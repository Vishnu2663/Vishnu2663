<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="100"
     viewBox="0 0 1000 100">

  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.045"
            stroke-width="1"/>
    </pattern>

    <!-- Text glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmer gradient -->
    <linearGradient id="shine">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip for shimmer -->
    <clipPath id="textClip">
      <rect x="0" y="0" width="1000" height="100"/>
    </clipPath>

  </defs>


  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect width="1000"
        height="100"
        rx="8"
        fill="url(#bg)"/>

  <!-- Animated grid -->
  <rect width="1000"
        height="100"
        fill="url(#grid)"
        opacity="0.8">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="30 30"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ========================= -->
  <!-- BORDER -->
  <!-- ========================= -->

  <rect x="2"
        y="2"
        width="996"
        height="96"
        rx="7"
        fill="none"
        stroke="url(#borderGradient)"
        stroke-width="2"
        opacity="0.8"/>

  <rect x="6"
        y="6"
        width="988"
        height="88"
        rx="5"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.08"
        stroke-width="1"/>


  <!-- ========================= -->
  <!-- GLOWING CORNER LIGHTS -->
  <!-- ========================= -->

  <circle cx="20"
          cy="20"
          r="3"
          fill="#00e5ff"
          filter="url(#strongGlow)">

    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="980"
          cy="80"
          r="3"
          fill="#8b5cf6"
          filter="url(#strongGlow)">

    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>


  <!-- ========================= -->
  <!-- LEFT ROBOT / GEAR ICON -->
  <!-- ========================= -->

  <text x="55"
        y="57"
        font-size="38"
        text-anchor="middle"
        dominant-baseline="middle">

    ⚙️

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 55 50"
      to="360 55 50"
      dur="8s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================= -->
  <!-- MAIN TEXT -->
  <!-- ========================= -->

  <g font-family="Fira Code, monospace"
     font-size="48"
     font-weight="800"
     text-anchor="middle"
     dominant-baseline="middle"
     filter="url(#glow)">

    <!-- 1 -->
    <text x="520"
          y="52"
          fill="#FF1493"
          opacity="0">

      ⚙️ Spring Boot &amp; Web Technologies

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="0s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8;0 0;0 0;0 -8"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="0s"
        repeatCount="indefinite"/>

    </text>


    <!-- 2 -->
    <text x="520"
          y="52"
          fill="#BF00FF"
          opacity="0">

      🍃 Node.Js &amp; PostgreSQL

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-2s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8;0 0;0 0;0 -8"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-2s"
        repeatCount="indefinite"/>

    </text>


    <!-- 3 -->
    <text x="520"
          y="52"
          fill="#1E90FF"
          opacity="0">

      🧑‍💻 Java Full Stack Developer

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-4s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8;0 0;0 0;0 -8"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-4s"
        repeatCount="indefinite"/>

    </text>


    <!-- 4 -->
    <text x="520"
          y="52"
          fill="#FFA500"
          opacity="0">

      ☁️ DevOps &amp; Cloud Enthusiast

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-6s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8;0 0;0 0;0 -8"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-6s"
        repeatCount="indefinite"/>

    </text>


    <!-- 5 -->
    <text x="520"
          y="52"
          fill="#32CD32"
          opacity="0">

      🛠️ MySQL, AWS &amp; DevOps Tools

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-8s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8;0 0;0 0;0 -8"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-8s"
        repeatCount="indefinite"/>

    </text>


    <!-- 6 -->
    <text x="520"
          y="52"
          fill="#FF4040"
          opacity="0">

      💡 Continuous Learner

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-10s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 8;0 0;0 0;0 -8"
        keyTimes="0;0.08;0.88;1"
        dur="12s"
        begin="-10s"
        repeatCount="indefinite"/>

    </text>

  </g>


  <!-- ========================= -->
  <!-- TERMINAL CURSOR -->
  <!-- ========================= -->

  <text x="965"
        y="53"
        fill="#00e5ff"
        font-family="Fira Code, monospace"
        font-size="28"
        font-weight="700">

    ▌

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================= -->
  <!-- SCANNING LINE -->
  <!-- ========================= -->

  <rect x="10"
        y="8"
        width="3"
        height="84"
        rx="2"
        fill="#00e5ff"
        opacity="0.5"
        filter="url(#glow)">

    <animate
      attributeName="x"
      from="10"
      to="987"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ========================= -->
  <!-- SMALL PARTICLES -->
  <!-- ========================= -->

  <circle cx="130" cy="20" r="1.5" fill="#00e5ff">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="870" cy="25" r="1.5" fill="#8b5cf6">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="2.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="160" cy="82" r="1.5" fill="#32CD32">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="840" cy="80" r="1.5" fill="#FF1493">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="2.2s"
      repeatCount="indefinite"/>
  </circle>

</svg>
