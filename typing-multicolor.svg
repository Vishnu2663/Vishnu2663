<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="80" viewBox="0 0 1000 80" role="img" aria-label="Java Full Stack, DevOps & Cloud, MySQL AWS DevOps, Spring Boot, Continuous Learner">
  <style><![CDATA[
    .text {
      font-family: "Fira Code", monospace;
      font-size: 30px;
      font-weight: 700;
    }

    /* base for all lines */
    .line {
      opacity: 0;
      animation: show 10s linear infinite;
    }

    .line1 { animation-delay: 0s; }
    .line2 { animation-delay: 2s; }
    .line3 { animation-delay: 4s; }
    .line4 { animation-delay: 6s; }
    .line5 { animation-delay: 8s; }

    /* each line visible for ~2s, then hidden */
    @keyframes show {
      0%, 16%   { opacity: 1; }
      20%, 100% { opacity: 0; }
    }

    /* blinking cursor on the right */
    .cursor {
      font-family: "Fira Code", monospace;
      font-size: 30px;
      font-weight: 700;
      fill: #ffffff;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  ]]></style>

  <rect width="1000" height="80" fill="transparent" />

  <text x="20" y="52" class="text line line1" fill="#1E90FF">🧑‍💻 Java Full Stack Developer</text>
  <text x="20" y="52" class="text line line2" fill="#FFA500">☁️ DevOps &amp; Cloud Enthusiast</text>
  <text x="20" y="52" class="text line line3" fill="#32CD32">🛠️ MySQL, AWS &amp; DevOps Tools</text>
  <text x="20" y="52" class="text line line4" fill="#FF1493">⚙️ Spring Boot &amp; Web Technologies</text>
  <text x="20" y="52" class="text line line5" fill="#9400D3">💡 Continuous Learner</text>

  <!-- cursor roughly at the end of the line -->
  <text x="900" y="52" class="cursor">|</text>
</svg>
