<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="90"
     viewBox="0 0 1000 90">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="25"
             height="25"
             patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="2"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <rect x="0"
        y="0"
        width="1000"
        height="90"
        rx="8"
        fill="url(#bg)"/>

  <rect x="0"
        y="0"
        width="1000"
        height="90"
        rx="8"
        fill="url(#grid)"/>


  <!-- ================================= -->
  <!-- OUTER BORDER -->
  <!-- ================================= -->

  <rect x="2"
        y="2"
        width="996"
        height="86"
        rx="8"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.25"
        stroke-width="2"/>

  <rect x="6"
        y="6"
        width="988"
        height="78"
        rx="6"
        fill="none"
        stroke="url(#border)"
        stroke-width="2"/>


  <!-- ================================= -->
  <!-- LEFT GEAR -->
  <!-- ================================= -->

  <text x="48"
        y="45"
        font-size="34"
        text-anchor="middle"
        dominant-baseline="middle">
    ⚙️
  </text>

  <!-- Gear rotation -->
  <animateTransform
      xlink:href="#gear"
      attributeName="transform"
      type="rotate"
      from="0 48 45"
      to="360 48 45"
      dur="8s"
      repeatCount="indefinite"/>


  <!-- ================================= -->
  <!-- TEXT -->
  <!-- ================================= -->

  <g class="texts"
     font-family="Fira Code, monospace"
     font-size="43"
     font-weight="800"
     text-anchor="middle"
     dominant-baseline="middle">


    <!-- 1 -->
    <text id="text1"
          x="520"
          y="45"
          fill="#FF1493"
          opacity="0">
      ⚙️ Spring Boot &amp; Web Technologies

      <animate
        attributeName="opacity"
        dur="18s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.01;0.03;0.14;0.16;1"/>
    </text>


    <!-- 2 -->
    <text id="text2"
          x="520"
          y="45"
          fill="#BF00FF"
          opacity="0">
      🍃 Node.Js &amp; PostgreSQL

      <animate
        attributeName="opacity"
        dur="18s"
        begin="-3s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.01;0.03;0.14;0.16;1"/>
    </text>


    <!-- 3 -->
    <text id="text3"
          x="520"
          y="45"
          fill="#1E90FF"
          opacity="0">
      🧑‍💻 Java Full Stack Developer

      <animate
        attributeName="opacity"
        dur="18s"
        begin="-6s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.01;0.03;0.14;0.16;1"/>
    </text>


    <!-- 4 -->
    <text id="text4"
          x="520"
          y="45"
          fill="#FFA500"
          opacity="0">
      ☁️ DevOps &amp; Cloud Enthusiast

      <animate
        attributeName="opacity"
        dur="18s"
        begin="-9s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.01;0.03;0.14;0.16;1"/>
    </text>


    <!-- 5 -->
    <text id="text5"
          x="520"
          y="45"
          fill="#32CD32"
          opacity="0">
      🛠️ MySQL, AWS &amp; DevOps Tools

      <animate
        attributeName="opacity"
        dur="18s"
        begin="-12s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.01;0.03;0.14;0.16;1"/>
    </text>


    <!-- 6 -->
    <text id="text6"
          x="520"
          y="45"
          fill="#FF4040"
          opacity="0">
      💡 Continuous Learner

      <animate
        attributeName="opacity"
        dur="18s"
        begin="-15s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.01;0.03;0.14;0.16;1"/>
    </text>

  </g>


  <!-- ================================= -->
  <!-- CURSOR -->
  <!-- ================================= -->

  <text x="965"
        y="46"
        fill="#00e5ff"
        font-family="Fira Code, monospace"
        font-size="28"
        font-weight="700">

    ▌

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================================= -->
  <!-- SCANNING LIGHT -->
  <!-- ================================= -->

  <rect x="70"
        y="10"
        width="2"
        height="70"
        rx="2"
        fill="#00e5ff"
        opacity="0.35"
        filter="url(#smallGlow)">

    <animate
      attributeName="x"
      from="70"
      to="930"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- PARTICLES -->
  <!-- ================================= -->

  <circle cx="95"
          cy="25"
          r="2"
          fill="#00e5ff">

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="900"
          cy="68"
          r="2"
          fill="#8b5cf6">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="2.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="150"
          cy="70"
          r="1.5"
          fill="#32CD32">

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="1.8s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="850"
          cy="20"
          r="1.5"
          fill="#FF1493">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="2.2s"
      repeatCount="indefinite"/>

  </circle>

</svg>
